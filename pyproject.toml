[project]
name = "trading-agent"
version = "0.1.0"
description = "Autonomous AI crypto trading agent – paper mode"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6.0,<7",
    "ccxt>=4.0,<5",
    "pandas>=2.1,<3",
    "numpy>=1.26,<2",
    "sqlalchemy>=2.0,<3",
    "litellm>=1.0,<2",
    "python-telegram-bot>=20.0,<21",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "streamlit>=1.30,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "hypothesis>=6.90,<7",
    "ruff>=0.3,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
